<div<!-- HTML: the cartoon globe, three city pins, the plane, and the info box -->
<div class="sc-wrap">
  <svg class="sc-map" viewBox="0 0 400 300" role="img" aria-label="Cartoon globe with a plane flying between New York, London and Tokyo">
    <defs>
      <clipPath id="scGlobeClip"><circle cx="200" cy="150" r="135"/></clipPath>
    </defs>
    <circle class="sc-ocean" cx="200" cy="150" r="135"/>
    <g clip-path="url(#scGlobeClip)">
      <path class="sc-land" d="M85,75 Q125,45 170,70 Q175,110 155,140 Q135,180 110,165 Q80,130 85,75 Z"/>
      <path class="sc-land" d="M180,55 Q215,50 228,72 Q220,98 232,140 Q238,205 205,225 Q180,195 188,140 Q172,100 180,55 Z"/>
      <path class="sc-land" d="M240,70 Q290,45 325,85 Q335,120 310,150 Q275,165 250,130 Q232,100 240,70 Z"/>
    </g>
    <circle class="sc-ring" cx="200" cy="150" r="135"/>
    <path id="scRoute" class="sc-route" d="M120,125 Q150,60 195,80 Q260,50 305,120 Q220,235 120,125"/>

    <g class="sc-pin" data-city="ny" tabindex="0" role="button" aria-label="New York">
      <circle class="sc-hit" cx="120" cy="125" r="18"/>
      <circle class="sc-dot" cx="120" cy="125" r="7"/>
      <text class="sc-label" x="120" y="150">New York</text>
    </g>
    <g class="sc-pin" data-city="london" tabindex="0" role="button" aria-label="London">
      <circle class="sc-hit" cx="195" cy="80" r="18"/>
      <circle class="sc-dot" cx="195" cy="80" r="7"/>
      <text class="sc-label" x="195" y="64">London</text>
    </g>
    <g class="sc-pin" data-city="tokyo" tabindex="0" role="button" aria-label="Tokyo">
      <circle class="sc-hit" cx="305" cy="120" r="18"/>
      <circle class="sc-dot" cx="305" cy="120" r="7"/>
      <text class="sc-label" x="300" y="145">Tokyo</text>
    </g>

    <g id="scPlane" class="sc-plane">
      <path d="M14,0 L2,-3 L-4,-12 L-7,-12 L-3,-2 L-9,-4 L-11,-3 L-8,0 L-11,3 L-9,4 L-3,2 L-7,12 L-4,12 L2,3 Z"/>
    </g>
  </svg>

  <div class="sc-info" aria-live="polite">
    <div class="sc-name">Tap a city</div>
    <div class="sc-line">Click New York, London or Tokyo to see info.</div>
  </div>

<!-- CSS: brand colors and Bungee font, sizing so it stays under 500px tall and fits phones -->
<style>
  .showcase .sc-wrap {
    max-width: 520px;
    margin: 0 auto;
    font-family: "Bungee", "Arial Black", Impact, sans-serif;
  }
  .showcase .sc-map {
    display: block;
    width: 100%;
    max-height: 290px;
  }
  .showcase .sc-ocean { fill: #123f85; }
  .showcase .sc-land { fill: #d4a359; }
  .showcase .sc-ring { fill: none; stroke: #ebe9df; stroke-width: 3; }
  .showcase .sc-route {
    fill: none;
    stroke: #ebe9df;
    stroke-width: 2;
    stroke-dasharray: 4 6;
    opacity: 0.7;
  }
  .showcase .sc-pin { cursor: pointer; outline: none; }
  .showcase .sc-hit { fill: transparent; }
  .showcase .sc-dot { fill: #ebe9df; stroke: #06224f; stroke-width: 3; }
  .showcase .sc-pin:hover .sc-dot,
  .showcase .sc-pin:focus .sc-dot,
  .showcase .sc-pin.sc-active .sc-dot { fill: #06224f; stroke: #ebe9df; }
  .showcase .sc-label {
    fill: #ebe9df;
    font-size: 13px;
    text-anchor: middle;
    stroke: #06224f;
    stroke-width: 3px;
    paint-order: stroke;
    pointer-events: none;
  }
  .showcase .sc-plane { fill: #ebe9df; stroke: #06224f; stroke-width: 1.5; pointer-events: none; }
  .showcase .sc-info {
    box-sizing: border-box;
    min-height: 90px;
    margin-top: 8px;
    padding: 10px 14px;
    background: #ebe9df;
    color: #06224f;
    border: 3px solid #d4a359;
    border-radius: 12px;
    text-align: center;
  }
  .showcase .sc-name { font-size: 22px; margin-bottom: 4px; }
  .showcase .sc-line { font-size: 14px; line-height: 1.3; }
</style>

<!-- JavaScript: flies the plane along the route and shows city info when a pin is clicked -->
<script>
  (function () {
    var wrap = document.querySelector('.showcase .sc-wrap');
    if (!wrap) return;

    var cities = {
      ny: { name: 'New York', pop: 'About 8.3 million people', known: 'Known for: Statue of Liberty, Times Square' },
      london: { name: 'London', pop: 'About 8.9 million people', known: 'Known for: Big Ben, Tower Bridge' },
      tokyo: { name: 'Tokyo', pop: 'About 14 million people', known: 'Known for: Shibuya Crossing, Tokyo Skytree' }
    };

    var info = wrap.querySelector('.sc-info');
    var pins = wrap.querySelectorAll('.sc-pin');

    function show(key, pin) {
      var c = cities[key];
      info.innerHTML =
        '<div class="sc-name">' + c.name + '</div>' +
        '<div class="sc-line">Population: ' + c.pop + '</div>' +
        '<div class="sc-line">' + c.known + '</div>';
      for (var i = 0; i < pins.length; i++) pins[i].classList.remove('sc-active');
      pin.classList.add('sc-active');
    }

    pins.forEach(function (pin) {
      pin.addEventListener('click', function () { show(pin.getAttribute('data-city'), pin); });
      pin.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          show(pin.getAttribute('data-city'), pin);
        }
      });
    });

    var route = wrap.querySelector('#scRoute');
    var plane = wrap.querySelector('#scPlane');
    var len = route.getTotalLength();
    var duration = 14000;

    function fly(t) {
      var d = ((t % duration) / duration) * len;
      var p = route.getPointAtLength(d);
      var q = route.getPointAtLength((d + 2) % len);
      var angle = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI;
      plane.setAttribute('transform', 'translate(' + p.x + ' ' + p.y + ') rotate(' + angle + ')');
      requestAnimationFrame(fly);
    }
    requestAnimationFrame(fly);
  })();
</script>></div>
